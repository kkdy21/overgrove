<text x="640" y="212" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">Welcome to Overgrove</text>
<text x="640" y="238" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" fill="#6e6e73" text-anchor="middle">See every worktree of a repository at a glance. Read-only — the only network action is git fetch.</text>
