<text x="484" y="636" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#6e6e73">Overgrove never asks for or stores tokens. Authentication stays with gh.</text>
<text x="280" y="714" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#6e6e73">Reopen anytime from Help › Setup Assistant.</text>
