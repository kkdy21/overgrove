<text x="439.027" y="332.5" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#6e6e73">Git repository · 6 worktrees</text>
<text x="344" y="352" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#6e6e73">Only folders you choose here are ever read.</text>
<rect x="280" y="384" width="720" height="72" rx="10" fill="#ffffff" stroke="#d9d9d9" stroke-width="1"/>
<circle cx="312" cy="412" r="12" fill="#0b8a0b"/>
