# Required check: `pr-policy`
# Enforces docs/process/pull-requests.md: Conventional title, `Closes #n` to an open issue, branch naming,
# the claim policy of ADR-0013 (claimed issues belong to their assignee; otherwise the first open PR wins), and the
# dependency rule of ADR-0014 (a PR passes only after every issue it depends on is done and no stand-in code is left).
# Untrusted PR fields are passed through env vars only (never interpolated into the script) to prevent injection.
name: pr-policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-policy:
    name: pr-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check title, linked issue, branch name, claim, and dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CREATED: ${{ github.event.pull_request.created_at }}
        run: |
          set -euo pipefail
          fail=0
          err() { echo "::error title=$1::$2"; fail=1; }

          # Claim policy (ADR-0013). The maintainer is exempt.
          claim_check() {
            local n="$1" data assignees earlier
            [ "$AUTHOR" = "$OWNER" ] && return 0
            data=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F n="$n" -f query='
              query($owner: String!, $name: String!, $n: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $n) {
                    assignees(first: 5) { nodes { login } }
                    closedByPullRequestsReferences(first: 20, includeClosedPrs: false) { nodes { number createdAt headRefName author { login } } }
                  }
                }
              }')
            assignees=$(jq -r '[.data.repository.issue.assignees.nodes[].login] | join(" ")' <<<"$data")
            if [ -n "$assignees" ]; then
              if [[ " $assignees " != *" $AUTHOR "* ]]; then
                err "Issue claimed" "#$n is claimed by @${assignees// /, @}. Pick an unclaimed issue and comment /claim, or wait until the claim expires (no PR within 5 hours)."
              else
                echo "#$n is claimed by the PR author."
              fi
            else
              earlier=$(jq -r --argjson me "$PR_NUMBER" --arg t "$PR_CREATED" --arg author "$AUTHOR" --arg n "$n" '
                [.data.repository.issue.closedByPullRequestsReferences.nodes[]
                 | select(.number != $me and .createdAt < $t and .author.login != $author)
                 | select(.headRefName | test("^[a-z]+/" + $n + "-"))]
                | sort_by(.createdAt) | .[0] | if . then "#\(.number) by @\(.author.login)" else "" end' <<<"$data")
              if [ -n "$earlier" ]; then
                err "First PR wins" "#$n is unclaimed but already has an earlier open PR ($earlier). Coordinate in that PR or pick another issue."
              else
                echo "#$n is unclaimed and this is the first open PR for it."
              fi
            fi
          }

          # Dependencies (ADR-0014): "Depends on #n" lines in a PR body, and #n under the "## 의존성" (or "Dependencies")
          # heading of an issue body. Keep these two functions in sync with .github/workflows/dependency-closed.yml.
          depends_on_lines() { tr -d '\r' | grep -Ei '^[[:space:]]*([-*][[:space:]]+)?depends[[:space:]]+on([[:space:]]|:)' | grep -Eo '#[0-9]+' | tr -d '#' || true; }
          dependency_section() { tr -d '\r' | awk '/^#+[ \t]*(의존성|Dependencies)/ {f=1; next} /^#+[ \t]/ {f=0} f' | grep -Eo '#[0-9]+' | tr -d '#' || true; }

          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "Dependabot PR — issue link and branch rules do not apply."
            exit 0
          fi

          # 1) Conventional Commits title (English), e.g. "feat(parser): parse rename records"
          title_re='^(feat|fix|docs|test|refactor|perf|chore|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: [^ ].{0,99}$'
          if ! printf '%s' "$TITLE" | grep -Eq "$title_re"; then
            err "PR title" "Use Conventional Commits, e.g. 'feat(parser): parse rename records' (max ~100 chars)."
          fi

          # 2) Branch name: <type>/<issue>-<slug>
          branch_re='^(feat|fix|docs|test|chore|spike|refactor|perf|ci)/([0-9]+)-[a-z0-9._-]+$'
          branch_issue=""
          if printf '%s' "$BRANCH" | grep -Eq "$branch_re"; then
            branch_issue=$(printf '%s' "$BRANCH" | sed -E 's#^[a-z]+/([0-9]+)-.*#\1#')
          else
            err "Branch name" "Name the branch <type>/<issue>-<slug>, e.g. feat/12-worktree-list."
          fi

          # 3) Body links at least one open issue with a closing keyword
          issues_body=$(printf '%s' "$BODY" | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' | grep -Eo '[0-9]+' || true)
          # GitHub's own link list also covers forms like "Closes owner/repo#n".
          issues_gh=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F pr="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) { closingIssuesReferences(first: 20) { nodes { number repository { nameWithOwner } } } }
              }
            }' --jq ".data.repository.pullRequest.closingIssuesReferences.nodes[] | select(.repository.nameWithOwner == \"$REPO\") | .number" 2>/dev/null || true)
          issues=$(printf '%s\n%s\n' "$issues_body" "$issues_gh" | grep -E '^[0-9]+$' | sort -un || true)
          if [ -z "$issues" ]; then
            err "Linked issue" "The PR body must contain 'Closes #<issue>' (no issue, no PR)."
          else
            for n in $issues; do
              info=$(gh api "repos/$REPO/issues/$n" --jq '[.state, (has("pull_request")|tostring)] | join(" ")' 2>/dev/null || echo "missing")
              case "$info" in
                "open false") echo "Linked issue #$n is open."; claim_check "$n" ;;
                missing)      err "Linked issue" "#$n does not exist." ;;
                *" true")     err "Linked issue" "#$n is a pull request, not an issue." ;;
                *)            err "Linked issue" "#$n is not open ($info)." ;;
              esac
            done
            if [ -n "$branch_issue" ] && ! printf '%s\n' $issues | grep -qx "$branch_issue"; then
              err "Branch/issue mismatch" "Branch refers to #$branch_issue but the body closes: $(echo $issues)."
            fi
          fi

          # 4) Dependencies (ADR-0014). Work may start on top of unfinished issues, but it merges only after them.
          deps=$( { printf '%s\n' "$BODY" | depends_on_lines
                    for n in $issues; do { gh api "repos/$REPO/issues/$n" --jq '.body // ""' 2>/dev/null || true; } | dependency_section; done
                  } | sort -un)
          for d in $deps; do
            case " $(echo $issues) " in *" $d "*) continue ;; esac
            # gh prints the error body to stdout on failure, so only parse the output of a successful call.
            if dinfo=$(gh api "repos/$REPO/issues/$d" --jq '[.state, (.state_reason // "none"), (has("pull_request")|tostring)] | join(" ")' 2>/dev/null); then
              read -r dstate dreason dis_pr <<<"$dinfo"
            else
              dstate=missing dreason="" dis_pr=""
            fi
            if [ "$dstate" = "missing" ]; then
              err "Dependency" "#$d does not exist. Fix the 'Depends on' line or the issue's dependency section."
            elif [ "$dis_pr" = "true" ]; then
              err "Dependency" "#$d is a pull request. Depend on the issue it closes instead: 'Depends on #<issue>'."
            elif [ "$dstate" = "open" ]; then
              err "Waiting on dependency" "#$d is not done yet. This is expected for a draft that builds on unfinished work: keep the PR as a draft. When #$d is merged, merge main into this branch, replace its STAND-IN code, and push."
            elif [ "$dreason" = "completed" ]; then
              echo "Dependency #$d is done."
            else
              err "Dependency not completed" "#$d was closed without being completed ($dreason). Ask the maintainer on the linked issue whether to depend on another issue, keep the needed code in this PR, or change the scope."
            fi
          done

          # 5) Stand-in code for unfinished dependencies must not reach main.
          standins=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files?per_page=100" \
            --jq '.[] | .filename as $f | (.patch // "") | split("\n")[] | select(startswith("+") and test("STAND-IN\\(#[0-9]+\\)")) | $f' 2>/dev/null | sort -u || true)
          if [ -n "$standins" ]; then
            err "Stand-in code" "Replace the STAND-IN code with the real implementation before merging: $(echo $standins)"
          fi

          exit $fail
