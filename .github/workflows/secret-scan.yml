# Required check: `gitleaks`
# Scans the full history on main and the PR's commit range on pull requests.
# gitleaks is downloaded from the official release and verified by SHA-256 (no third-party action, ADR-0006 / T17).
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit cancels a pull request's running check. A push to main never cancels the main run in progress: back-to-back
# merges would otherwise keep main from ever finishing (#585). GitHub keeps one running and one pending run per group,
# and the pending one is replaced by the newest push, so runs do not pile up and the latest main is still checked.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned + checksum verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" "$url"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "Scanning PR commits ${BASE_SHA}..${HEAD_SHA}"
            gitleaks git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .
          else
            echo "Scanning full history"
            gitleaks git --no-banner --redact --verbose .
          fi

      # SEC-T18-01/02 (#95): the real hooks block a staged and a pushed home path, and the repository's rules flag
      # personal paths while allowing placeholders. Samples are built at runtime, so nothing here is a committed leak.
      # After the scan on purpose: this step runs code from the PR, which must not be able to touch the gitleaks
      # binary or the checkout before the scan has run (security review of #218).
      - name: Secret-scanning controls
        env:
          OVERGROVE_REQUIRE_GITLEAKS: "1"
        run: scripts/lint/check-secret-scanning.test.sh
