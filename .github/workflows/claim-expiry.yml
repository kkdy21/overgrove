# Releases expired issue claims and applies "first PR wins" (ADR-0013). Logic: scripts/github/claim-expiry.sh
# Runs on the default branch only (schedule), checks out trusted base-repository code, never PR code.
# Then reconciles the project board (ADR-0016) with PROJECT_TOKEN (project scope only), because claims released here
# use GITHUB_TOKEN and do not start board-sync.yml.
name: claim-expiry

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would change"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: claim-expiry
  cancel-in-progress: false

jobs:
  expire:
    name: expire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce claim lease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LEASE_HOURS: "5"
          STALE_HOURS: "72"
          MAX_CLAIMS: "2"
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: scripts/github/claim-expiry.sh $DRY_RUN
      - name: Reconcile board status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            msg="PROJECT_TOKEN is not set, so the board was not reconciled (docs/process/github-settings.md §3)."
            # A warning, not a notice, and on the summary page: a skipped reconcile hid the missing token (#595).
            echo "::warning title=board-sync::$msg"
            echo "**Board reconcile skipped:** $msg" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          scripts/github/board-sync.sh reconcile $DRY_RUN
