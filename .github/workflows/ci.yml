# Required check: `build-test`
# Builds the app and runs OvergroveTests on a pinned macOS runner and Xcode major version.
# Bump RUNNER/XCODE_MAJOR together in a PR; record notable toolchain changes in CHANGELOG.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XCODE_MAJOR: "26"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          xcode=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode ${XCODE_MAJOR}.x on this runner image."; exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $xcode"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          xcrun swift-format --version
          git --version
          /usr/bin/git --version

      - name: Validate repository tooling
        run: |
          set -euo pipefail
          for f in scripts/*.sh scripts/github/*.sh scripts/lint/*.sh .githooks/* .claude/hooks/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
          echo "ok  shell syntax"
          scripts/lint/check-forbidden-apis.sh
          echo "ok  forbidden-API check"
          scripts/lint/check-no-dependencies.sh
          scripts/lint/check-no-dependencies.test.sh
          # SEC-T17-02/03: pinned actions, minimal permissions, untrusted input via env, Dependabot (#95).
          scripts/lint/check-workflows.sh
          scripts/lint/check-workflows.test.sh
          # SEC-T18-01: secret scanning wired into pre-commit, pre-push and CI; hooks fail without gitleaks (#95).
          # The gitleaks-dependent half runs in secret-scan.yml, where gitleaks is installed.
          scripts/lint/check-secret-scanning.sh
          scripts/lint/check-secret-scanning.test.sh
          for f in .github/labels.json .claude/settings.json .swift-format design/tokens/tokens.json; do
            jq empty "$f"
          done
          echo "ok  JSON"
          scripts/github/board-sync-rules.test.sh

      - name: Fixture repository smoke test
        run: |
          set -euo pipefail
          scripts/make-fixture-repo.sh "$RUNNER_TEMP/fixture"
          scripts/make-fixture-repo.sh --malicious "$RUNNER_TEMP/fixture-malicious"

      - name: swift-format lint
        run: xcrun swift-format lint --strict --recursive --configuration .swift-format Overgrove OvergroveTests

      # design-tokens.md §4 / ADR-0017: colors pass the contrast rules, and the committed Asset Catalog and
      # Tokens.generated.swift are exactly what the generator produces from tokens.json.
      - name: Design tokens are valid and up to date
        run: |
          set -euo pipefail
          if ! python3 design/mockups/generator/colorcheck.py > "$RUNNER_TEMP/colorcheck.txt"; then
            cat "$RUNNER_TEMP/colorcheck.txt"; exit 1
          fi
          tail -n 1 "$RUNNER_TEMP/colorcheck.txt"
          swift scripts/tokens/generate.swift
          if ! git diff --exit-code --stat; then
            echo "::error::Generated design tokens are stale. Run: swift scripts/tokens/generate.swift"; exit 1
          fi
          untracked=$(git status --porcelain --untracked-files=all)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::The generator created files that are not committed."; exit 1
          fi
          echo "ok  design tokens"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Overgrove.xcodeproj \
            -scheme Overgrove \
            -destination 'platform=macOS' \
            -resultBundlePath "$RUNNER_TEMP/Overgrove.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log"

      # Integration results depend on the git version (test-strategy.md), so record the git the tests ran (the app
      # resolves "$DEVELOPER_DIR/usr/bin/git", not the PATH git) and fail if no integration suite actually ran.
      - name: Integration tests and git version
        if: success() || failure()
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/xcodebuild.log"
          app_git=$("$DEVELOPER_DIR/usr/bin/git" --version)
          {
            echo "### git used by tests"
            echo "- app git (\`\$DEVELOPER_DIR/usr/bin/git\`): ${app_git}"
            echo "- PATH git: $(git --version)"
            echo
            echo "### Integration suites"
            if [ -f "$log" ]; then
              grep -E "^Test Suite '([A-Za-z]+IntegrationTests|FixtureRepoTests|CanaryHarnessTests)' (passed|failed)" "$log" \
                | sed 's/^/- /' || echo "- none found"
            else
              echo "- no xcodebuild log"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "app git: ${app_git}"
          [ -f "$log" ] || exit 0  # the build step already failed; nothing more to check
          ran=$(grep -cE "^Test Suite '[A-Za-z]+IntegrationTests' (passed|failed)" "$log" || true)
          if [ "${ran:-0}" -eq 0 ]; then
            echo "::error::No integration test suite ran (expected *IntegrationTests in OvergroveTests/Integration)."
            exit 1
          fi
          echo "ok  ${ran} integration suite(s) ran"

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcresult-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/Overgrove.xcresult
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
