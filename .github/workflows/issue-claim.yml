# `/claim` and `/unclaim` issue comment commands (ADR-0013, docs/process/collaboration.md).
#
# Security notes (T17):
#   - Runs on `issue_comment` in the base repository with an `issues: write` token.
#   - It never checks out or executes repository or PR code.
#   - The comment body is untrusted: it is passed through env and only its first word is compared to fixed strings.
name: issue-claim

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  claim:
    name: claim
    # Only command comments start this job, so ordinary comments never enter the concurrency group below.
    if: >-
      ${{ !github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
          (startsWith(github.event.comment.body, '/claim') || startsWith(github.event.comment.body, '/unclaim')) }}
    # Serialize per commenter so the open-claims cap cannot be raced with a burst of /claim comments.
    # Two different users claiming the same issue at once is resolved after assignment (earliest wins).
    # GitHub keeps only one pending run per group: in a burst of commands from one user, a middle one may be dropped.
    concurrency:
      group: issue-claim-${{ github.event.comment.user.login }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Handle /claim or /unclaim
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          ISSUE: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          LEASE_HOURS: "5"
          MAX_CLAIMS: "2"
          COOLDOWN_HOURS: "24"
        run: |
          set -euo pipefail
          first_line=${BODY%%$'\n'*}
          first_line=${first_line%$'\r'}
          cmd=${first_line%% *}
          case "$cmd" in /claim|/unclaim) ;; *) exit 0 ;; esac

          say() { gh issue comment "$ISSUE" --repo "$REPO" --body "$1" >/dev/null; }
          assignees_of() { gh api "repos/$REPO/issues/$ISSUE" --jq '[.assignees[].login] | join(" ")'; }
          info=$(gh api "repos/$REPO/issues/$ISSUE")
          state=$(jq -r .state <<<"$info")
          assignees=$(jq -r '[.assignees[].login] | join(" ")' <<<"$info")
          labels=$(jq -r '[.labels[].name] | join(" ")' <<<"$info")
          has_label() { [[ " $labels " == *" $1 "* ]]; }
          is_assignee() { [[ " $assignees " == *" $1 "* ]]; }

          if [[ "$cmd" == "/unclaim" ]]; then
            if is_assignee "$ACTOR"; then
              gh api -X DELETE "repos/$REPO/issues/$ISSUE/assignees" -f "assignees[]=$ACTOR" >/dev/null
              say "👋 @$ACTOR released this issue. Anyone can \`/claim\` it now. (선점 해제)"
            else
              say "@$ACTOR you have not claimed this issue, so there is nothing to release."
            fi
            exit 0
          fi

          # ---- /claim ----
          if [[ "$state" != "open" ]]; then say "@$ACTOR this issue is closed and cannot be claimed."; exit 0; fi
          for l in type:epic status:blocked status:needs-decision status:triage; do
            if has_label "$l"; then
              say "@$ACTOR this issue has \`$l\` and cannot be claimed. Epics are worked through their sub-issues; blocked, undecided, or untriaged issues are not ready yet. (선점할 수 없는 상태입니다)"
              exit 0
            fi
          done
          if [[ -n "$assignees" ]]; then
            if is_assignee "$ACTOR"; then say "@$ACTOR this issue is already yours."; else say "@$ACTOR this issue is already claimed by @${assignees// /, @}. It is released automatically if no PR is opened within ${LEASE_HOURS} hours of claiming."; fi
            exit 0
          fi

          # Someone else already has an open PR for this issue (branch <type>/<issue>-<slug>): first PR wins.
          other_pr=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F n="$ISSUE" -f query='
            query($owner: String!, $name: String!, $n: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $n) {
                  closedByPullRequestsReferences(first: 20, includeClosedPrs: false) { nodes { number headRefName author { login } } }
                }
              }
            }' | jq -r --arg me "$ACTOR" --arg n "$ISSUE" '
              [.data.repository.issue.closedByPullRequestsReferences.nodes[]
               | select(.author.login != $me and (.headRefName | test("^[a-z]+/" + $n + "-")))]
              | .[0] | if . then "#\(.number) by @\(.author.login)" else "" end')
          if [[ -n "$other_pr" ]]; then
            say "@$ACTOR this issue already has an open pull request ($other_pr). First PR wins — please pick another issue."
            exit 0
          fi

          if [[ "$ACTOR" != "$OWNER" ]]; then
            # Open claims, counted from the issue list API (not the search index, which lags).
            open_claims=$(gh api --paginate "repos/$REPO/issues?state=open&assignee=$ACTOR&per_page=100" --jq '.[] | select(.pull_request | not) | .number' | wc -l | tr -d ' ')
            if (( open_claims >= MAX_CLAIMS )); then
              say "@$ACTOR you already have $open_claims open claimed issues (limit $MAX_CLAIMS). Finish or \`/unclaim\` one first. (동시 선점 한도 초과)"
              exit 0
            fi
            # Cooldown: a claim on this issue by the same user expired recently.
            marker="<!-- claim-expired:$ACTOR -->"
            recent=$(gh api --paginate "repos/$REPO/issues/$ISSUE/comments?per_page=100" | jq -s --arg m "$marker" --argjson h "$COOLDOWN_HOURS" '
              [.[][] | select((.body | contains($m)) and ((now - (.created_at | fromdateiso8601)) < ($h * 3600)))] | length')
            if (( recent > 0 )); then
              say "@$ACTOR your previous claim on this issue expired less than ${COOLDOWN_HOURS} hours ago. Please let someone else try first. (만료 후 ${COOLDOWN_HOURS}시간 재선점 제한)"
              exit 0
            fi
            # GitHub only lets some users be assigned (e.g. people who commented on the issue).
            if ! gh api "repos/$REPO/issues/$ISSUE/assignees/$ACTOR" >/dev/null 2>&1; then
              say "@$ACTOR GitHub does not allow assigning you to this issue yet. A maintainer will take a look."
              exit 1
            fi
          fi

          gh api -X POST "repos/$REPO/issues/$ISSUE/assignees" -f "assignees[]=$ACTOR" >/dev/null
          now_assignees=$(assignees_of)
          if [[ " $now_assignees " != *" $ACTOR "* ]]; then
            say "@$ACTOR GitHub did not assign you to this issue. A maintainer will take a look."
            exit 1
          fi
          # Race with another user's /claim on the same issue: the earliest assignment wins.
          if [[ "$now_assignees" != "$ACTOR" ]]; then
            winner=$(gh api graphql -F owner="${REPO%%/*}" -F name="${REPO##*/}" -F n="$ISSUE" -f query='
              query($owner: String!, $name: String!, $n: Int!) {
                repository(owner: $owner, name: $name) {
                  issue(number: $n) { timelineItems(itemTypes: [ASSIGNED_EVENT], last: 20) { nodes { ... on AssignedEvent { createdAt assignee { ... on User { login } } } } } }
                }
              }' | jq -r --arg as " $now_assignees " '
                [.data.repository.issue.timelineItems.nodes[] | select(.assignee.login as $l | $as | contains(" " + $l + " "))]
                | sort_by(.createdAt) | .[0].assignee.login')
            if [[ "$winner" != "$ACTOR" ]]; then
              gh api -X DELETE "repos/$REPO/issues/$ISSUE/assignees" -f "assignees[]=$ACTOR" >/dev/null
              say "@$ACTOR @$winner claimed this issue a moment earlier, so your claim was undone. Please pick another issue."
              exit 0
            fi
          fi
          deadline=$(date -u -d "+${LEASE_HOURS} hours" '+%Y-%m-%d %H:%M UTC')
          say "✅ Claimed by @$ACTOR. Open a pull request (a draft is fine) from a branch named \`<type>/$ISSUE-<slug>\` whose body contains \`Closes #$ISSUE\` **before $deadline** (${LEASE_HOURS}h), or the claim is released automatically. Use \`/unclaim\` if you stop. See [collaboration rules](https://github.com/$REPO/blob/main/docs/process/collaboration.md). (선점 완료: ${LEASE_HOURS}시간 안에 PR을 여세요)"
