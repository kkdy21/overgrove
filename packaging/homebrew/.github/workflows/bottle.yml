# Example workflow for kkdy21/homebrew-tap (ADR-0027 in kkdy21/overgrove). It is not a workflow of kkdy21/overgrove:
# copy it to the tap's .github/workflows/ and run it there.
#
# Builds the Overgrove bottle for Apple silicon from Formula/overgrove.rb at the checked-out commit, records where it
# came from with a build provenance attestation, and attaches it to a release of the tap. Run it by hand on the
# branch where the formula points at the new tag. It prints the bottle block to add to the formula on that branch
# before merging (docs/process/release.md in kkdy21/overgrove).
name: bottle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bottle
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Sigstore certificate for the attestation
      attestations: write # store the attestation
    outputs:
      version: ${{ steps.bottle.outputs.version }}
      file: ${{ steps.bottle.outputs.file }}
      sha256: ${{ steps.bottle.outputs.sha256 }}
    env:
      XCODE_MAJOR: "26"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          xcode=$(ls -d /Applications/Xcode_${XCODE_MAJOR}*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode ${XCODE_MAJOR}.x on this runner image."; exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          sw_vers
          brew --version

      - name: Build and test
        run: |
          set -euo pipefail
          # Tap this checkout, so the bottle comes from exactly the formula of this commit.
          brew tap kkdy21/tap "$GITHUB_WORKSPACE"
          # Installing by the full name trusts this one formula (Homebrew tap trust).
          brew install --build-bottle kkdy21/tap/overgrove
          brew test kkdy21/tap/overgrove

      - name: Bottle
        id: bottle
        run: |
          set -euo pipefail
          version=$(brew info --json=v2 kkdy21/tap/overgrove | jq -r '.formulae[0].versions.stable')
          root_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/overgrove-${version}"
          mkdir out
          cd out
          # Each version gets one bottle (rebuild 0). Without --no-rebuild, brew bumps the rebuild number because the
          # tapped checkout already has this version. A bottle that needs fixing ships as a new patch version.
          brew bottle --json --no-rebuild --root-url="$root_url" kkdy21/tap/overgrove
          # brew names the bottle after this runner's macOS. Name it for macOS 14, the app's minimum: Homebrew uses a
          # bottle for an older macOS on every newer one (ADR-0027). The file content and sha256 stay the same.
          # Keep brew's local name (`name--version`) here: HOMEBREW_VERIFY_ATTESTATIONS matches the attestation
          # subject against it. The release asset gets the download name (`name-version`) in the publish job.
          built=$(ls overgrove--"${version}".*.bottle.tar.gz)
          file="overgrove--${version}.arm64_sonoma.bottle.tar.gz"
          mv "$built" "$file"
          sha256=$(shasum -a 256 "$file" | cut -d' ' -f1)
          cellar=$(jq -r '.[].bottle.cellar' ./*.bottle.json)
          case "$cellar" in
            /opt/homebrew/Cellar) cellar_arg="" ;;
            any | any_skip_relocation) cellar_arg="cellar: :${cellar}, " ;;
            *) echo "::error::Unexpected cellar: ${cellar}"; exit 1 ;;
          esac
          {
            echo "version=${version}"
            echo "file=${file}"
            echo "sha256=${sha256}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### overgrove ${version}"
            echo
            echo "Add this block to Formula/overgrove.rb after the release is published:"
            echo
            echo '```ruby'
            echo "  bottle do"
            echo "    root_url \"${root_url}\""
            echo "    sha256 ${cellar_arg}arm64_sonoma: \"${sha256}\""
            echo "  end"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/${{ steps.bottle.outputs.file }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottle
          path: out/${{ steps.bottle.outputs.file }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload the bottle
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bottle

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          FILE: ${{ needs.build.outputs.file }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          # The file must be the one the build job attested.
          echo "${SHA256}  ${FILE}" | sha256sum --strict -c -
          # Homebrew downloads `<root_url>/overgrove-<version>.<tag>.bottle.tar.gz` (one dash).
          asset="overgrove-${FILE#overgrove--}"
          mv "$FILE" "$asset"
          # Tag the commit the bottle was built from. Fails if the release already exists: a published bottle is
          # never replaced.
          gh release create "overgrove-${VERSION}" "$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "overgrove ${VERSION}" \
            --notes "Overgrove ${VERSION} bottle for Apple silicon, macOS 14 or later. Check where it came from: gh attestation verify ${asset} --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/bottle.yml"
